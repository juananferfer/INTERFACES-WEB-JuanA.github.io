<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 12</title>

        <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    </head>
    <body>

        <div class="container">

            <h1 class="text-center my-4">Pagina con Bootstrap</h1>

            <!-- FILA 1 -->
            <div class="row ">
                <div class="caja bg-primary col-12 col-sm-6 col-md-4 text-start">
                    Columna 1
                </div>

                <div class="caja bg-success col-12 col-sm-6 col-md-4 text-start">
                    Columna 2
                </div>

                <div class="caja bg-danger col-12 col-sm-6 col-md-4 text-start">
                    Columna 3
                </div>
            </div>

            <!-- FILA 2 -->
            <div class="row ">
                <div class="caja bg-warning col-12 col-sm-6 col-md-4 text-center p-2">
                    Columna 1
                </div>

                <div class="caja bg-info col-12 col-sm-6 col-md-4 text-center p-2">
                    Columna 2
                </div>

                <div class="caja bg-secondary col-12 col-sm-6 col-md-4 text-center p-2">
                    Columna 3
                </div>
            </div>

            <!-- FILA 3 -->
            <div class="row">
                <div class="caja bg-dark col-12 col-sm-6 col-md-4 text-end p-3">
                    Columna 1
                </div>

                <div class="caja bg-primary col-12 col-sm-6 col-md-4 text-end p-3">
                    Columna 2
                </div>

                <div class="caja bg-success col-12 col-sm-6 col-md-4 text-end p-3">
                    Columna 3
                </div>
            </div>

            <!-- FILA 4 -->
            <div class="row ">
                <div class="caja bg-danger col-12 col-sm-6 col-md-4 text-start p-4">
                    Columna 1
                </div>

                <div class="caja bg-warning col-12 col-sm-6 col-md-4 text-center p-4">
                    Columna 2
                </div>

                <div class="caja bg-info col-12 col-sm-6 col-md-4 text-end p-4">
                    Columna 3
                </div>
            </div>

            <!-- FILA 5 -->
            <div class="row ">
                <div class="caja bg-dark col-12 col-sm-6 col-md-4 p-3">
                    Columna 1
                </div>

                <div class="caja bg-secondary col-12 col-sm-6 col-md-4 p-4">
                    Columna 2
                </div>

                <div class="caja bg-primary col-12 col-sm-6 col-md-4">
                    Columna 3
                </div>
            </div>
        </div>
    </body>
</html>
